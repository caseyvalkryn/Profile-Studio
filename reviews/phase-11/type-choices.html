<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Typeface choices</title>
<!-- Lane 11.2, round 1. The fonts come from Google Fonts at view time, as the mockup does; nothing is installed. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&family=Manrope:wght@400;500&family=Recursive:wght,MONO@400,0;400,1;500,0;500,1&display=swap" />
<style>
  :root {
    --surface-0: #eeebe4; --surface-1: #f7f5f0; --surface-2: #e4e0d8; --surface-3: #d8d3c9;
    --rule-strong: #b0aa9e; --text: #212220; --text-muted: #4e504b; --text-subtle: #696b61;
    --accent: #2862b0; --accent-text: #eeebe4; --hostile: #d43725; --friend: #2862b0;
    --fs-1: 11px; --lh-1: 14px; --fs-2: 12px; --lh-2: 16px; --fs-3: 13px; --lh-3: 18px;
    --fs-4: 14px; --lh-4: 20px; --fs-5: 17px; --lh-5: 24px; --ls-caps: 0.06em;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --surface-0: #121313; --surface-1: #191a1a; --surface-2: #0e0f0f; --surface-3: #2a2c2b;
    --rule-strong: #454846; --text: #ebe9e3; --text-muted: #a9a9a3; --text-subtle: #8c8e88;
    --accent: #7ba7e8; --accent-text: #121313; --hostile: #e46f62; --friend: #7fbfe6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text); font: 400 var(--fs-3)/var(--lh-3) system-ui, sans-serif; font-feature-settings: "tnum"; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--surface-3); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: var(--fs-4); line-height: var(--lh-4); font-weight: 500; margin: 0; }
  header p { margin: 0; color: var(--text-muted); font-size: var(--fs-2); line-height: var(--lh-2); }
  header .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 0 10px; height: 26px; font: 500 var(--fs-2)/26px inherit; color: var(--text-muted); }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--surface-1); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; padding: 16px; }
  .spec { background: var(--surface-1); border: 1px solid var(--surface-3); border-radius: 6px; overflow: hidden; }
  .spec[data-pick] { outline: 2px solid var(--accent); outline-offset: -2px; }
  .spec .head { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--surface-3); background: var(--surface-1); }
  .spec .head h2 { margin: 0; font-size: var(--fs-4); line-height: var(--lh-4); font-weight: 500; }
  .spec .head .pkg { margin-left: auto; color: var(--text-subtle); font-size: var(--fs-1); line-height: var(--lh-1); font-family: var(--mono); }
  .spec .why { padding: 8px 12px 0; color: var(--text-muted); font-size: var(--fs-2); line-height: var(--lh-2); }
  .spec .why b { color: var(--text); font-weight: 500; }
  .block { padding: 10px 12px; font-family: var(--ui); }
  .caps { font-size: var(--fs-1); line-height: var(--lh-1); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-subtle); font-weight: 500; }
  .title { font-size: var(--fs-4); line-height: var(--lh-4); font-weight: 500; display: flex; align-items: baseline; gap: 10px; }
  .title .id { font-family: var(--mono); font-weight: 400; font-size: var(--fs-2); color: var(--text-muted); }
  .rows { margin-top: 6px; border-top: 1px solid var(--surface-3); }
  .row { display: grid; grid-template-columns: 56px 1fr 112px 72px; gap: 8px; align-items: center; height: 24px; padding: 0 8px; border-bottom: 1px solid var(--surface-3); font-size: var(--fs-3); line-height: var(--lh-3); }
  .row[aria-current="true"] { background: var(--surface-3); box-shadow: inset 2px 0 0 var(--accent); }
  .row .k { font-family: var(--mono); font-size: var(--fs-2); color: var(--text-muted); }
  .row .k.h { color: var(--hostile); } .row .k.f { color: var(--friend); }
  .row .n { font-family: var(--mono); font-size: var(--fs-2); text-align: right; font-variant-numeric: tabular-nums; }
  .readout { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: var(--fs-2); line-height: var(--lh-2); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .readout b { color: var(--text); font-weight: 500; }
  .caption { margin-top: 10px; font-size: var(--fs-5); line-height: var(--lh-5); color: var(--text); }
  .caption small { display: block; font-size: var(--fs-2); line-height: var(--lh-2); color: var(--text-subtle); font-family: var(--mono); margin-top: 2px; }
  .ctl { margin-top: 10px; display: flex; gap: 6px; }
  .ctl span { height: 26px; padding: 0 10px; border: 1px solid var(--rule-strong); border-radius: 4px; font-size: var(--fs-2); line-height: 24px; color: var(--text-muted); }
  .ctl span.on { background: var(--text); color: var(--surface-1); border-color: var(--text); font-weight: 500; }
  .ctl kbd { font-family: var(--mono); font-size: var(--fs-1); margin-left: 6px; opacity: 0.8; }
  .glyphs { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--surface-3); color: var(--text-muted); font-size: var(--fs-2); line-height: var(--lh-2); }
  .glyphs .m { font-family: var(--mono); display: block; font-variant-numeric: tabular-nums; }
  .m0 { font-family: var(--mono); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Typeface choices</h1>
    <p>Lane 11.2 shortlist. The app's five sizes (11, 12, 13, 14, 17 px) and two weights (400, 500) in each family. Fonts load from Google Fonts for this page only; nothing is installed.</p>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<main id="specs"></main>
<template id="spec">
  <section class="spec">
    <div class="head"><h2 class="name"></h2><span class="pkg"></span></div>
    <p class="why"></p>
    <div class="block">
      <div class="title">CUAS-001 Single fixed-wing ingress <span class="id">PROF-1 v3</span></div>
      <div class="caps" style="margin-top:8px">Systems</div>
      <div class="rows">
        <div class="row"><span class="k f">S-01</span><span>3D radar</span><span class="n">2,400 m</span><span class="n">12.5°</span></div>
        <div class="row" aria-current="true"><span class="k f">S-02</span><span>RF detector</span><span class="n">1,800 m</span><span class="n">360°</span></div>
        <div class="row"><span class="k f">E-01</span><span>RF effector</span><span class="n">1,200 m</span><span class="n">90°</span></div>
        <div class="row"><span class="k h">T-01</span><span>Fixed wing, 28 m/s</span><span class="n">120 m AGL</span><span class="n">t+0:00</span></div>
        <div class="row"><span class="k h">T-02</span><span>Quad, 15 m/s</span><span class="n">60 m AGL</span><span class="n">t+1:10</span></div>
      </div>
      <div class="readout"><b>t+1:35</b><span>Margin <b>+0:12</b> (−0:04)</span><span>Find 0:18</span><span>Fix 0:27</span><span>Track 0:41</span><span>Engage 1:23</span></div>
      <div class="ctl"><span class="on">Plan<kbd>1</kbd></span><span>Elevation<kbd>2</kbd></span><span>3D<kbd>3</kbd></span><span>Add waypoints<kbd>W</kbd></span><span>Save as card<kbd>C</kbd></span></div>
      <div class="caption">At t+95 s the envelope count goes from one to two. That moment is the split event.<small>3 of 6 · CARD-3 · Plan · 0:95</small></div>
      <div class="glyphs">Hamburgefonstiv Il1 O0 — 0123456789 ±×°<span class="m">0123456789 Il1 O0 1,024.50 9,876.25 0.125 t+12:34 S-02 E-01</span></div>
    </div>
  </section>
</template>
<script>
  const FAMILIES = [
    { name: 'Archivo + JetBrains Mono (today)', ui: "'Archivo', system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace", pkg: '@fontsource/archivo, @fontsource/jetbrains-mono', why: '<b>Baseline.</b> The pair in the product now, for comparison. The brief replaces both.' },
    { name: 'Geist + Geist Mono', ui: "'Geist', system-ui, sans-serif", mono: "'Geist Mono', ui-monospace, monospace", pkg: '@fontsource/geist, @fontsource/geist-mono · 45 kB', why: '<b>Worker pick 1.</b> Calm Swiss grotesk made for dense product UI; the mono shares its skeleton, so label and number read as one line. The nearest open match to the SpaceX register.' },
    { name: 'Instrument Sans (one family)', ui: "'Instrument Sans', system-ui, sans-serif", mono: "'Instrument Sans', system-ui, sans-serif", pkg: '@fontsource/instrument-sans · 33 kB', why: '<b>Worker pick 2.</b> Neo-grotesque with a little warmth; numbers in tabular figures from the same family, so the panel stays one voice. The lightest option.' },
    { name: 'Instrument Sans + Geist Mono', ui: "'Instrument Sans', system-ui, sans-serif", mono: "'Geist Mono', ui-monospace, monospace", pkg: '@fontsource/instrument-sans, @fontsource/geist-mono · 53 kB', why: '<b>Variant of pick 2.</b> The same text face with a visibly different voice for ids, times and coordinates.' },
    { name: 'Manrope (one family)', ui: "'Manrope', system-ui, sans-serif", mono: "'Manrope', system-ui, sans-serif", pkg: '@fontsource/manrope · 28 kB', why: '<b>Worker pick 3.</b> Geometric, open counters, clear numerals; rounder and a step less operator panel. Wide round figures take more column width.' },
    { name: 'Recursive (one variable family)', ui: "'Recursive', system-ui, sans-serif", mono: "'Recursive', ui-monospace, monospace", monoAxis: true, pkg: '@fontsource-variable/recursive · 305 kB', why: '<b>Worker pick 4.</b> One design spans sans (MONO 0) and mono (MONO 1) through its axes; exact parity between text and numbers at ten times the file size.' },
  ];
  const main = document.getElementById('specs');
  const tpl = document.getElementById('spec');
  for (const f of FAMILIES) {
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.style.setProperty('--ui', f.ui);
    node.style.setProperty('--mono', f.mono);
    node.querySelector('.name').textContent = f.name;
    node.querySelector('.pkg').textContent = f.pkg;
    node.querySelector('.why').innerHTML = f.why;
    if (f.monoAxis) {
      for (const el of node.querySelectorAll('.k, .n, .readout, .id, .m, kbd, .caption small')) el.style.fontVariationSettings = '"MONO" 1';
    }
    main.appendChild(node);
  }
  const root = document.documentElement;
  const saved = (() => { try { return localStorage.getItem('typeChoices.theme'); } catch { return null; } })();
  const setTheme = (t) => {
    root.dataset.theme = t;
    for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', String(b.dataset.theme === t));
    try { localStorage.setItem('typeChoices.theme', t); } catch {}
  };
  setTheme(saved === 'dark' ? 'dark' : 'light');
  for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => setTheme(b.dataset.theme));
</script>
</body>
</html>
